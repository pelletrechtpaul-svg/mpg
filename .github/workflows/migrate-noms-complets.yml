name: Migrate noms complets

# Migration one-off (voir scripts/migrate-noms-complets.cjs). Simulation par
# défaut ; avec confirm = "migrer", sauvegarde la base (artefact
# firestore-backup) puis écrit.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Taper "migrer" pour écrire en DB (sinon simulation)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/charming-goodall-4nt05x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Write service account key
        run: echo "$FIREBASE_SERVICE_ACCOUNT" > serviceAccountKey.json
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Backup before writing
        if: inputs.confirm == 'migrer'
        run: node scripts/backup-firestore.cjs

      - name: Upload backup
        if: inputs.confirm == 'migrer'
        uses: actions/upload-artifact@v4
        with:
          name: firestore-backup
          path: backup/
          retention-days: 90
          if-no-files-found: error

      - name: Migrate
        run: node scripts/migrate-noms-complets.cjs
        env:
          DRY_RUN: ${{ inputs.confirm == 'migrer' && 'false' || 'true' }}

      - name: Remove service account key
        if: always()
        run: rm -f serviceAccountKey.json
