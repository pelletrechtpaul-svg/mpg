name: Deploy MPG vit la nuit

on:
  push:
    branches: [claude/automate-fetch-YKuaY]
    paths: ['night/**', 'data/**']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/automate-fetch-YKuaY

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & build
        run: |
          cd night
          npm ci
          npm run build

      - name: Deploy to gh-pages-night
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages-night 2>/dev/null || true

          cp -r night/dist /tmp/night-dist

          git checkout --orphan gh-pages-night-tmp
          git rm -rf . --quiet
          cp -r /tmp/night-dist/. .
          touch .nojekyll

          git add -A
          git commit -m "deploy: MPG vit la nuit $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push origin HEAD:gh-pages-night --force

      - name: Enable GitHub Pages on gh-pages-night
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages \
            -d '{"source":{"branch":"gh-pages-night","path":"/"}}' || true
          curl -s -o /dev/null \
            -X PUT \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages \
            -d '{"source":{"branch":"gh-pages-night","path":"/"}}' || true
          echo "GitHub Pages configuré sur gh-pages-night"
