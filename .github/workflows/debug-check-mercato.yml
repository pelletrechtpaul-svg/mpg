name: Debug check mercato

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/charming-goodall-4nt05x
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/debug-photos.cjs
      - name: Commit previews
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add photo-preview/
          if git diff --cached --quiet; then
            echo "Rien à committer."
          else
            git commit -m "debug: crop previews"
            git push origin claude/charming-goodall-4nt05x
          fi
