name: Debug check mercato

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/charming-goodall-4nt05x
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Write service account key
        run: echo "$FIREBASE_SERVICE_ACCOUNT" > serviceAccountKey.json
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - run: node scripts/debug-check-mercato.cjs
      - name: Remove service account key
        if: always()
        run: rm -f serviceAccountKey.json
