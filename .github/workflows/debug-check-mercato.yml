name: Debug check mercato

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/charming-goodall-4nt05x
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/debug-photos.cjs
