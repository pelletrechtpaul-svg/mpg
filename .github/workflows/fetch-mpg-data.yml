name: Fetch MPG Data

on:
  workflow_dispatch:
    inputs:
      league_codes:
        description: 'Codes de ligues séparés par virgule (laisser vide = valeurs par défaut)'
        required: false
        default: ''
  schedule:
    # Tous les jours à 7h UTC
    - cron: '0 7 * * *'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/scrape-mpg-api-TjKxV
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run MPG scraper
        env:
          MPG_TOKEN: ${{ secrets.MPG_TOKEN }}
          MPG_LEAGUE_CODES: ${{ github.event.inputs.league_codes || 'SMGCPCDA,SKUNA5KT,SV6836ER,TMPWW77U,SSC13PHL,SKU4CP3P,SMGBRR3Z' }}
        run: node scripts/fetch-mpg-data.cjs

      - name: Commit data if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config http.postBuffer 524288000
          git add data/
          if git diff --cached --quiet; then
            echo "Aucune nouvelle donnée."
          else
            git commit -m "chore: update MPG data $(date -u +'%Y-%m-%d %H:%M UTC')"
            for i in 1 2 3 4; do
              git push origin claude/scrape-mpg-api-TjKxV && break
              echo "Push échoué (tentative $i), retry dans ${i}0s…"
              sleep $((i * 10))
            done
          fi
