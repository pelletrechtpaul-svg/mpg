name: Reset mercato

on:
  workflow_dispatch:
    inputs:
      confirm_delete:
        description: 'Écrire EXACTEMENT "supprimer" pour effectuer la suppression réelle (sinon dry-run)'
        required: false
        default: ''
      keep_saison:
        description: 'Saison à conserver'
        required: false
        default: '2026/2027'
      keep_ligue:
        description: 'Ligue à conserver'
        required: false
        default: 'Liga'

permissions:
  contents: write

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/charming-goodall-4nt05x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Write service account key
        run: echo "$FIREBASE_SERVICE_ACCOUNT" > serviceAccountKey.json
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Run reset (dry-run unless confirmed)
        env:
          KEEP_SAISON: ${{ github.event.inputs.keep_saison }}
          KEEP_LIGUE: ${{ github.event.inputs.keep_ligue }}
          DRY_RUN: ${{ github.event.inputs.confirm_delete == 'supprimer' && 'false' || 'true' }}
        run: node scripts/reset-mercato.cjs

      - name: Remove service account key
        if: always()
        run: rm -f serviceAccountKey.json

      - name: Commit results
        if: ${{ github.event.inputs.confirm_delete == 'supprimer' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/players-registry.json public/players-photos.json
          if git diff --cached --quiet; then
            echo "Rien à committer."
          else
            git commit -m "chore: reset mercato - conserve ${{ github.event.inputs.keep_saison }} / ${{ github.event.inputs.keep_ligue }}"
            git push origin claude/charming-goodall-4nt05x
          fi
