name: Import mercato

on:
  push:
    branches: [claude/charming-goodall-4nt05x]
    paths: ['scripts/mercato-imports/*.json']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/charming-goodall-4nt05x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Write service account key
        run: echo "$FIREBASE_SERVICE_ACCOUNT" > serviceAccountKey.json
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Import pending mercato files
        run: |
          shopt -s nullglob
          files=(scripts/mercato-imports/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "Aucun fichier à importer."
            exit 0
          fi
          for f in "${files[@]}"; do
            echo "=== Import $f ==="
            DRY_RUN=false node scripts/import-mercato.cjs "$f"
            mv "$f" "scripts/mercato-imports/done/$(basename "$f")"
          done

      - name: Remove service account key
        if: always()
        run: rm -f serviceAccountKey.json

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/players-registry.json public/players-photos.json scripts/mercato-imports/
          if git diff --cached --quiet; then
            echo "Rien à committer."
          else
            git commit -m "chore: import mercato via Actions $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push origin claude/charming-goodall-4nt05x
          fi
